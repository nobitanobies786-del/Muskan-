<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | MS Muskan Select</title><link rel="stylesheet" href="../styles.css"><style>.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.box{border:1px solid var(--line);padding:20px;background:#fff}.box h3{margin-top:0}.preview{max-width:100%;max-height:180px;object-fit:contain;background:var(--cream);padding:8px}.mini{font-size:11px;color:#777}.productRow{border:1px solid var(--line);padding:12px;margin:7px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.productRow img{width:58px;height:58px;object-fit:cover;background:var(--cream)}@media(max-width:800px){.adminGrid{grid-template-columns:1fr}}</style></head><body><main class="section container"><div class="sectionTitle"><div><span>PRIVATE ADMIN</span><h2>Store Management</h2><p class="mini">Logo, background and product uploads are supported. GitHub Pages static mode stores changes in this browser; the Node backend saves them to the live server.</p></div></div><section id="login" class="box" style="max-width:430px"><input id="email" placeholder="Admin email" style="width:100%;padding:13px;margin-bottom:10px;border:1px solid var(--line)"><input id="pass" type="password" placeholder="Password" style="width:100%;padding:13px;margin-bottom:10px;border:1px solid var(--line)"><button class="btn gold full" onclick="login()">Secure Login</button><p id="err"></p></section><section id="panel" style="display:none"><div class="adminGrid"><div class="box"><h3>Branding</h3><label class="mini">Logo</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" style="width:100%;padding:10px 0"><img id="logoPreview" class="preview" style="width:140px;height:100px;display:block"><button class="btn gold" onclick="uploadBrand('logo')">Save Logo</button><hr><label class="mini">Hero / Background</label><input id="heroFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="width:100%;padding:10px 0"><img id="heroPreview" class="preview" style="width:100%;height:180px;display:block"><button class="btn gold" onclick="uploadBrand('hero')">Save Background</button><p id="brandMsg" class="mini"></p></div><div class="box"><h3>Add Highlight Product</h3><form id="pf" style="display:grid;gap:8px"><input name="name" required placeholder="Product name" style="padding:10px"><input name="category" required placeholder="Category" style="padding:10px"><input name="price" required type="number" placeholder="Price" style="padding:10px"><input name="compareAt" type="number" placeholder="Old price" style="padding:10px"><input name="stock" type="number" placeholder="Stock" style="padding:10px"><input name="badge" placeholder="Badge" style="padding:10px"><textarea name="description" placeholder="Description" style="padding:10px"></textarea><input id="productImage" type="file" accept="image/png,image/jpeg,image/webp" style="padding:8px"><label><input name="everShine" type="checkbox"> EverShine</label><label><input name="featured" type="checkbox" checked> Highlight / Best Seller</label><button class="btn gold">Add Product</button></form><p id="productMsg" class="mini"></p></div></div><div class="box" style="margin-top:15px"><h3>Products / Highlights</h3><div id="products"></div></div><div class="box" style="margin-top:15px"><h3>Orders</h3><div id="orders"></div></div></section></main><script>
let token="",staticMode=false,products=[],settings={};const $=s=>document.querySelector(s);const hdr=()=>({Authorization:"Bearer "+token,"Content-Type":"application/json"});
async function loadStatic(){staticMode=true;products=JSON.parse(localStorage.getItem("ms_admin_products")||"null")||await fetch("../data/products.json").then(r=>r.json());settings=JSON.parse(localStorage.getItem("ms_admin_settings")||"null")||await fetch("../data/site-settings.json").then(r=>r.json());localStorage.setItem("ms_admin_products",JSON.stringify(products));localStorage.setItem("ms_admin_settings",JSON.stringify(settings));render();setPreviews()}
async function login(){try{let r=await fetch("../api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#email").value,password:$("#pass").value})});if(!r.ok)throw Error();let j=await r.json();token=j.token;staticMode=false;showPanel();await loadBackend()}catch(e){await loadStatic();showPanel();$("#err").textContent="Static/GitHub Pages mode: changes stay in this browser. For permanent live uploads, use the Node backend."}}
function showPanel(){$("#login").style.display="none";$("#panel").style.display="block"}
async function loadBackend(){let [p,o,s]=await Promise.all([fetch("../api/products").then(r=>r.json()),fetch("../api/admin/orders",{headers:hdr()}).then(r=>r.json()),fetch("../api/site-settings").then(r=>r.json())]);products=p;settings=s;render();setPreviews();$("#orders").innerHTML=o.length?o.map(x=>`<div class="productRow"><span><b>${esc(x.id)}</b> • ${esc(x.paymentMethod)} • ${esc(x.paymentStatus)}<br>${esc(x.customer?.name||"")} • ${esc(x.customer?.phone||"")} • ₹${x.total}</span></div>`).join(""):"No orders yet."}
function render(){$("#products").innerHTML=products.length?products.map(x=>`<div class="productRow"><div style="display:flex;gap:10px;align-items:center">${x.image?`<img src="${esc(asset(x.image))}">`:''}<span><b>${esc(x.name)}</b><br><small>${esc(x.category)} • ₹${x.price} • Stock ${x.stock}</small><br><label class="mini"><input type="checkbox" ${x.featured?'checked':''} onchange="feature('${x.id}',this.checked)"> Highlight</label></span></div><button onclick="del('${x.id}')">Delete</button></div>`).join(""):"No products yet.";if(staticMode)$("#orders").innerHTML="Orders are available when the Node backend is connected."}
function asset(x){if(!x)return "";if(/^data:|^https?:\/\//i.test(x))return x;return x.startsWith("assets/")?"../"+x:x}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setPreviews(){if(settings.logo)$("#logoPreview").src=asset(settings.logo);if(settings.hero)$("#heroPreview").src=asset(settings.hero)}
function syncStatic(){settings.featuredProductIds=products.filter(p=>p.featured).map(p=>p.id);localStorage.setItem("ms_admin_products",JSON.stringify(products));localStorage.setItem("ms_admin_settings",JSON.stringify(settings))}
async function feature(id,on){let p=products.find(x=>x.id===id);if(!p)return;p.featured=on;if(staticMode){syncStatic();render()}else{await fetch("../api/admin/products/"+id,{method:"PUT",headers:hdr(),body:JSON.stringify({featured:on})});loadBackend()}}
async function del(id){if(!confirm("Delete this product?"))return;if(staticMode){products=products.filter(x=>x.id!==id);syncStatic();render();return}await fetch("../api/admin/products/"+id,{method:"DELETE",headers:hdr()});loadBackend()}
async function fileData(input){const f=input.files[0];if(!f)return null;if(f.size>6*1024*1024)throw Error("Image is too large. Keep it under 6 MB.");return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function uploadBrand(type){try{const data=await fileData($(type==='logo'?"#logoFile":"#heroFile"));if(!data)return alert("Choose an image first.");if(staticMode){settings[type]=data;localStorage.setItem("ms_admin_settings",JSON.stringify(settings));setPreviews();$("#brandMsg").textContent="Saved in this browser.";return}const r=await fetch("../api/admin/site-settings",{method:"PUT",headers:hdr(),body:JSON.stringify({type,data})});const j=await r.json();if(!r.ok)throw Error(j.error);settings=j;setPreviews();$("#brandMsg").textContent="Saved to server."}catch(e){alert(e.message)}}
$("#pf").onsubmit=async e=>{e.preventDefault();try{let o=Object.fromEntries(new FormData(e.target));const img=await fileData($("#productImage"));o.everShine=e.target.everShine.checked;o.featured=e.target.featured.checked;if(img)o.image=img;if(staticMode){o.id="p_"+Date.now();o.price=Number(o.price);o.compareAt=Number(o.compareAt||o.price);o.stock=Number(o.stock||0);products.push(o);syncStatic();e.target.reset();render();$("#productMsg").textContent="Product saved in this browser.";return}let r=await fetch("../api/admin/products",{method:"POST",headers:hdr(),body:JSON.stringify(o)});let j=await r.json();if(!r.ok)throw Error(j.error);e.target.reset();loadBackend();$("#productMsg").textContent="Product saved to server."}catch(e){alert(e.message)}};
$("#logoFile").onchange=()=>{const f=$("#logoFile").files[0];if(f)$("#logoPreview").src=URL.createObjectURL(f)};$("#heroFile").onchange=()=>{const f=$("#heroFile").files[0];if(f)$("#heroPreview").src=URL.createObjectURL(f)};
</script></body></html>
