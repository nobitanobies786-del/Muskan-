<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | MS Muskan Select</title><link rel="stylesheet" href="../styles.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><div class="announce">SECURE CHECKOUT • MS MUSKAN SELECT</div><header><div class="head container"><a class="brand" href="../"><img src="../assets/ms-muskan-select-logo.png"><span><b>MS Muskan Select</b><small>Premium Collection</small></span></a></div></header><main class="section container"><div class="sectionTitle"><div><span>CHECKOUT</span><h2>Complete your order</h2></div></div><div style="display:grid;grid-template-columns:1.2fr .8fr;gap:25px"><form id="checkoutForm" style="border:1px solid var(--line);padding:22px;display:grid;gap:11px"><input required name="name" placeholder="Full name" style="padding:14px;border:1px solid var(--line)"><input required name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" style="padding:14px;border:1px solid var(--line)"><input type="email" name="email" placeholder="Email (optional)" style="padding:14px;border:1px solid var(--line)"><textarea required name="address" placeholder="Full delivery address" style="padding:14px;border:1px solid var(--line);min-height:100px"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input required name="city" placeholder="City" style="padding:14px;border:1px solid var(--line)"><input required name="pincode" pattern="[0-9]{6}" placeholder="Pincode" style="padding:14px;border:1px solid var(--line)"></div><input name="state" placeholder="State" style="padding:14px;border:1px solid var(--line)"><input id="coupon" placeholder="Coupon code (MUSKAN10)" style="padding:14px;border:1px solid var(--line)"><label style="font-size:12px"><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label><label style="font-size:12px"><input type="radio" name="pay" value="ONLINE"> UPI / GPay / Cards (Razorpay)</label><button class="btn gold" type="submit">Place Order / Pay Securely</button><p id="msg" style="font-size:12px;color:#777"></p></form><div id="summary" style="border:1px solid var(--line);padding:22px;height:max-content"></div></div></main><script>
const productsPromise=fetch("../api/products").then(r=>{if(!r.ok)throw Error();return r.json()}).catch(()=>fetch("../data/products.json").then(r=>r.json()));const cart=JSON.parse(localStorage.getItem("ms_cart")||"[]");const money=n=>"₹"+Number(n).toLocaleString("en-IN");
async function boot(){const ps=await productsPromise;let sub=cart.reduce((a,i)=>a+(ps.find(p=>p.id===i.id)?.price||0)*i.qty,0);document.querySelector("#summary").innerHTML="<h3 style='font:600 24px Playfair Display'>Your order</h3>"+cart.map(i=>{let p=ps.find(x=>x.id===i.id);return `<p style='display:flex;justify-content:space-between;font-size:12px'><span>${p.name} × ${i.qty}</span><b>${money(p.price*i.qty)}</b></p>`}).join("")+`<hr><p style='display:flex;justify-content:space-between'><b>Subtotal</b><b>${money(sub)}</b></p>`;document.querySelector("#checkoutForm").onsubmit=e=>submit(e,ps)}async function submit(e,ps){e.preventDefault();const f=new FormData(e.target),customer=Object.fromEntries(f.entries());const pay=customer.pay;delete customer.pay;const items=cart;const coupon=document.querySelector("#coupon").value.trim().toUpperCase();const msg=document.querySelector("#msg");msg.textContent="Processing…";try{if(!items.length)throw new Error("Your cart is empty.");if(pay==="COD"){const r=await fetch("../api/orders/cod",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer,items,coupon})});const j=await r.json();if(!r.ok)throw new Error(j.error);localStorage.removeItem("ms_cart");location.href="../pages/order-success.html?id="+j.order.id}else{const r=await fetch("../api/payment/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer,items,coupon})});const j=await r.json();if(!r.ok)throw new Error(j.error);const options={key:j.keyId,amount:j.amount*100,currency:"INR",name:"MS Muskan Select",description:"Premium Collection",order_id:j.razorpayOrderId,prefill:{name:customer.name,email:customer.email,contact:customer.phone},theme:{color:"#c8a15a"},handler:async response=>{const v=await fetch("../api/payment/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...response,customer,items,coupon})});const out=await v.json();if(!v.ok)return alert(out.error);localStorage.removeItem("ms_cart");location.href="../pages/order-success.html?id="+out.order.id}};new Razorpay(options).open()}}catch(err){msg.textContent=err.message}}boot();
</script></body></html>
