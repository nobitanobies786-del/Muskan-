<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | MS Muskan Select</title><link rel="stylesheet" href="../styles.css"></head><body><main class="section container"><span>ORDER TRACKING</span><h1 style="font:600 44px 'Playfair Display'">Track your order</h1><form id="f" style="display:flex;gap:8px;max-width:550px"><input id="id" required placeholder="Enter Order ID" style="flex:1;padding:13px;border:1px solid var(--line)"><button class="btn gold">Track</button></form><div id="out" style="margin-top:25px"></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("../api/orders/"+id.value.trim()),j=await r.json();out.innerHTML=r.ok?`<div style="border:1px solid var(--line);padding:20px"><b>${j.id}</b><p>Status: ${j.status}</p><p>Payment: ${j.paymentStatus}</p><p>Shipping: ${j.shippingStatus}</p><p>Total: ₹${j.total}</p></div>`:`<p>${j.error}</p>`}</script></body></html>
